<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A little question for Maryam before her birthday surprise."
    />
    <title>A Little Question for Maryam</title>
    <link rel="stylesheet" href="question.css" />
    <script src="question.js" defer></script>
  </head>
  <body>
    <main class="question-card">
      <div class="heart" aria-hidden="true">♥</div>
      <p class="eyebrow">Before your surprise...</p>
      <h1 id="question-message" aria-live="polite" aria-atomic="true">
        Hi maryam, do you love us?
      </h1>
      <div class="actions" aria-label="Choose your answer">
        <a class="button button-yes" href="index.html">Yes!</a>
        <button class="button button-no" id="no-button" type="button">No</button>
      </div>
      <p class="hint">Choose wisely <span aria-hidden="true">♡</span></p>
    </main>
  </body>
</html>
