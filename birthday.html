<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="A little birthday wish for Maryam, with a flower growing just for her."
    />
    <title>Happy Birthday, Maryam!</title>
    <link rel="stylesheet" href="styles.css" />
    <script src="script.js" defer></script>
  </head>
  <body>
    <main class="birthday-card">
      <div class="sparkle sparkle-one" aria-hidden="true">✦</div>
      <div class="sparkle sparkle-two" aria-hidden="true">✧</div>
      <div class="sparkle sparkle-three" aria-hidden="true">✦</div>

      <section class="greeting" aria-labelledby="birthday-title">
        <p class="eyebrow">A little something just for you</p>
        <h1 id="birthday-title">Happy Birthday, <span>My Love!</span></h1>
        <p class="message">
          May your day bloom with love, Khadeejah's affection, and all the
          happiness your heart can hold.
        </p>
        <p class="sign-off">Wishing you the sweetest year dealing with our shenanigens <span aria-hidden="true">♡</span></p>
      </section>

      <div
        class="garden"
        role="img"
        aria-label="An animated red rose grows from the ground and blooms"
      >
        <div class="flower">
          <div class="blossom rose">
            <svg class="rose-art" viewBox="0 0 120 120" aria-hidden="true">
              <defs>
                <linearGradient id="rose-red" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ff8b91" />
                  <stop offset=".42" stop-color="#e52e4d" />
                  <stop offset="1" stop-color="#850b27" />
                </linearGradient>
                <linearGradient id="rose-light" x1="0" y1="0" x2="1" y2="1">
                  <stop offset="0" stop-color="#ffb5b7" />
                  <stop offset=".48" stop-color="#f34c64" />
                  <stop offset="1" stop-color="#b90f36" />
                </linearGradient>
              </defs>
              <path
                class="rose-outer"
                d="M59 105C42 107 25 97 22 83 8 74 12 55 23 47 18 32 33 19 48 27 57 11 76 15 81 30 98 26 108 42 99 57 111 73 99 91 83 94 77 103 68 106 59 105Z"
              />
              <path
                class="rose-petal rose-petal-outer-left"
                d="M54 81C39 87 25 79 27 66 28 56 37 51 49 59 40 49 40 39 47 34 55 29 64 36 64 46 72 38 82 42 83 51 84 61 75 68 65 69Z"
              />
              <path
                class="rose-petal rose-petal-outer-right"
                d="M66 82C81 87 95 78 92 65 90 56 82 52 71 60 80 49 79 39 72 34 64 29 55 37 56 47 48 38 38 43 37 52 36 61 45 69 55 70Z"
              />
              <path
                class="rose-petal rose-petal-left"
                d="M55 91C41 97 29 88 32 77 34 68 42 65 53 73 43 62 43 52 50 47 59 41 67 49 66 59 74 50 83 54 84 63 85 72 77 78 67 79 74 85 67 91 55 91Z"
              />
              <path
                class="rose-petal rose-petal-right"
                d="M65 91C79 97 91 87 87 76 84 68 77 65 67 73 77 62 77 52 70 47 61 41 53 49 54 59 46 50 37 54 36 63 35 72 43 78 53 79 46 85 53 91 65 91Z"
              />
              <path
                class="rose-petal rose-petal-back"
                d="M46 67C34 60 29 48 35 39 40 32 49 34 55 44 52 31 58 23 66 24 76 25 78 36 72 47 84 38 94 43 93 53 92 63 82 69 70 67Z"
              />
              <path
                class="rose-petal rose-petal-front"
                d="M50 83C38 80 34 70 40 63 45 57 53 59 59 67 59 57 65 51 72 54 80 57 79 66 73 72 84 70 89 77 85 84 80 92 67 91 59 86Z"
              />
              <path
                class="rose-petal rose-petal-inner-left"
                d="M55 80C47 78 43 71 47 65 50 60 56 61 60 67 59 59 64 55 69 58 74 61 72 67 68 71 76 70 79 76 75 81 71 86 62 85 58 81Z"
              />
              <path
                class="rose-petal rose-petal-inner-right"
                d="M64 80C72 78 76 71 72 65 69 60 63 61 59 67 60 59 55 55 50 58 45 61 47 67 51 71 43 70 40 76 44 81 48 86 57 85 61 81Z"
              />
              <path
                class="rose-curl"
                d="M59 77C51 76 48 70 51 65 54 60 61 59 65 63 70 67 67 73 62 74 57 75 54 71 56 68 58 65 62 66 62 68 62 70 60 70 59 69"
              />
              <path
                class="rose-highlight"
                d="M28 51C28 41 35 34 43 36M77 31C85 31 90 37 89 44M26 69C26 78 32 85 40 87M78 88C83 84 85 79 84 75"
              />
            </svg>
          </div>
          <div class="stem">
            <span class="leaf leaf-left"></span>
            <span class="leaf leaf-right"></span>
          </div>
        </div>
        <div class="ground"></div>
      </div>

      <p class="footer-note">Today is yours to shine ✨</p>
    </main>
  </body>
</html>
